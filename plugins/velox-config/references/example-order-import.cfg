        'procedure CreateIssue(const aIssueNum: integer; const aDescripti' +
        'on: String);'
      'var lStatus: integer;'
      '  lDesc: string;'
      'begin'
      
        '  if SilenceChildErrors then Exit; //dont create issues when sil' +
        'enced'
      '  '
      '  lDesc := vxFormat('#39'%s (%d)'#39', [aDescription, aIssueNum]);'
      '  '
      
        '  //0=Status_NotSet,1=Status_Success,2=Status_Warning,3=Status_I' +
        'ssue,4=Status_Duplicate,5=Status_Cancelled,6=Status_Error,7=Stat' +
        'us_Test,8=Status_Highlight'
      '  lStatus := GetIssueDetails(aIssueNum);'
      '  case lStatus of'
      '    0: exit; //dont show message or add to issue table'
      
        '    1: begin LogInfo(lDesc); Exit; end; //dont need to log info ' +
        'to the table- just put into log output '
      '    2: LogWarning(lDesc);'
      '    3: LogIssue(lDesc);'
      '    4: LogDuplicate(lDesc);'
      '    5: LogCancel(lDesc);'
      '    6: LogError(lDesc);'
      '    7: LogTest(lDesc);'
      '    8: LogHighlight(lDesc);'
      
        '    else LogError('#39'Critical Error creating issue - contact suppo' +
        'rt'#39');'
      '  end;'
      '  '
      '  if Not Assigned(DIssue) then Exit;'
      '  DIssue.Insert;'
      '  DIssue['#39'ISSUENUM'#39'].Value := aIssueNum;'
      '  if DIssue.FieldExists('#39'STATUS'#39') then //todo remove later....'
      '    DIssue['#39'STATUS'#39'].Value := lStatus;'
      
        '  if DIssue.FieldExists('#39'FIELDNAME'#39') then //todo remove later...' +
        '.'
      '    DIssue['#39'FIELDNAME'#39'].Value := ScriptFieldName;'
      '  DIssue['#39'DESCRIPTION'#39'].Value := lDesc;'
      '  DIssue.Post;'
      '  '
      'end;'
