        'P.AppNum = %d and P.Code = %s --CreateProductCheck'#39', [DATA_Appli' +
        'cation['#39'Num'#39'].AsInteger, SafeSQL(aCode)]));'
      
        '  if DATA_Product.Empty then //Create a record then return it in' +
        ' results...'
      
        '    ExecSQLData(DATA_Product, vxFormat('#39'  insert into Product (A' +
        'ppNum, Code, Description, Active, Valid) values (%d, %s, %s, 1, ' +
        '0); SELECT SCOPE_IDENTITY() as Num --CreateProduct'#39', [DATA_Appli' +
        'cation['#39'Num'#39'].AsInteger, SafeSQL(aCode), SafeSQL(aDescription)])' +
        ');'
