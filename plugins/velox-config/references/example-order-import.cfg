        'Num = %d --CreateProduct'#39', [DATA_Product['#39'Num'#39'].AsInteger]));'
      '  Result := DATA_Product['#39'Num'#39'].AsInteger;'
      '  '
      
        '  CreateIssue(1521, vxFormat('#39'Product %s (%s) auto-created for a' +
        'pplication %s.'#39', [aCode, aDescription, DATA_Application['#39'Descrip' +
        'tion'#39'].AsString]));'
      'end;'
