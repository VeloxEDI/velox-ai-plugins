      '                    if Result = 0 then'
      '                    begin'
      '                      SilenceChildErrors := False;'
      
        '                      Result := GetProductDefault(Join([aProduct' +
        'Code, aProductGTIN, aBuyerCode], '#39'|'#39', False)); if Result <> 0 th' +
        'en Exit;'
      
        '                      if (Settings['#39'AutoCreateProduct'#39'].AsBoolea' +
        'n) and (aProductCode <> '#39#39') then'
      
        '                        Result := CreateProduct(aProductCode, '#39#39 +
        ')    '
      '                      else'
      
        '                        CreateIssue(1021, vxFormat('#39'Product not ' +
        'found using ProductCode %s or GTIN %s or BuyerCode %s for custom' +
        'er %s for application %s.'#39', [aProductCode, aProductGTIN, aBuyerC' +
        'ode, DATA_BillTo['#39'Code'#39'].AsString, DATA_Application['#39'Description' +
        #39'].AsString]));'
      '                    end;'
      '                  end;'
      '                end;'
      '              end;'
      '            end;'
      '          end;'
      '        end;'
      '      end;'
      '    end;'
      '  end;'
      '  '
