    object FloViewMap5: TvxViewMap
      Description = 'Order_Line'
      BeforeMapFormula.Strings = (
        '{$I Velox}'
        'procedure BeforeMapEvent(var Value:Variant);  //Order_Line'
        'begin'
        
          '  SetIssueTable(D_Order_Issue_Line); //set table that will recei' +
          've any error messages'
        '  LogSQLComment('#39'Order Line '#39'+OrderLine['#39'Code'#39'].AsSql);'
        '  '
        '  LogInfo(OrderLine['#39'LineNo'#39'].AsInfo);'
        '  LogInfo(OrderLine['#39'Code'#39'].AsInfo);'
        '  '
        
          '  if IsNullorEmpty(OrderLine['#39'Code'#39'].Value) and IsNullorEmpty(Or' +
          'derLine['#39'Num'#39'].Value) then'
        
          '    CreateIssue(1201, '#39'Order_Line.Code or Order_Line.Num value m' +
          'ust be provided'#39');'
        '    '
        
          '  if OrderLine['#39'LocationCode'#39'].AsString <> '#39#39' then   //Data_Loca' +
          'tion already opened with header value, if line value blank use t' +
          'he header value (if set)'
        '    GetLocation(OrderLine['#39'LocationCode'#39'].AsString);'
        ''
        '  if IsSourceInternal(SourceNum) then'
        '    GetProductForCode(OrderLine['#39'ProductCode'#39'].AsString)'
        '  else if TypeNum = Type_SalesOrder then'
        
          '    GetProduct(Data_BillTo, OrderLine['#39'ProductCode'#39'].AsString, O' +
          'rderLine['#39'GTIN'#39'].AsString, OrderLine['#39'BuyerCode'#39'].AsString)'
        '  else'
        
          '    GetProduct(Data_BillFrom, OrderLine['#39'ProductCode'#39'].AsString,' +
          ' OrderLine['#39'GTIN'#39'].AsString, OrderLine['#39'BuyerCode'#39'].AsString); '
        '  if Data_Product.NotEmpty then'
        '  begin'
        '    if Not DATA_Product['#39'Active'#39'].AsBoolean then'
        
          '      CreateIssue(1326, vxFormat('#39'Product %s is not active so ca' +
          'nnot be ordered.'#39', [DATA_Product['#39'Code'#39'].AsString]));'
        '    if DATA_Product['#39'OnHold'#39'].AsBoolean then'
        
          '      CreateIssue(1327, vxFormat('#39'Product %s is on hold and cann' +
          'ot be ordered at this time.'#39', [DATA_Product['#39'Code'#39'].AsString]));'
        '  end;'
        '  '
        '  GetTax(OrderLine['#39'TaxCode'#39'].AsString);'
        '  '
        
          '  if HasError then //Stop processing if error, issues want to ke' +
          'ep processing and save to DB.'
        '  begin'
        '    Value := False;'
        '    Exit;'
        '  end;'
        ''
        '  DATA_OrderLine.Active := False;'
        '  if CheckBoolean(MESSAGE['#39'Settings_Update'#39'].Value) then'
        '  begin'
        '    if Not DATA_Order.Eof then //order exists so check for line'
        '    begin'
        
          '      CheckOrderLine(OrderLine['#39'Num'#39'].AsString, OrderLine['#39'Code'#39 +
          '].AsString);'
        '      if Data_OrderLine.NotEmpty then'
        
          '        LogInfo('#39'Updating line '#39' +Data_OrderLine['#39'Code'#39'].AsStrin' +
          'g); '
        '    end;'
        '    //cant check for rowhash if deleting orphans...'
        
          '    {if (OrderConsignee['#39'RowHash'#39'].AsString = DATA_OrderConsigne' +
          'e['#39'RowHash'#39'].AsString) then //tranhash hasnt changed so no need ' +
          'to update'
        '        Value := False}'
        '  end;'
        'end;')
      LinkedDataFormula.Strings = (
        
          'procedure LinkedDataEvent(var LinkedData:TdaQueryDataView);  //I' +
          'nvoice_Line'
        'begin'
        '  LinkedData := ORDERLINE;'
        'end;')
      AfterDetailMapFormula.Strings = (
        '{$I Velox}'
        'procedure AfterDetailMapEvent(var Value: Variant);  //Order_Line'
        'begin'
        
          '  if Not Value then Exit;  //only need to do this if the details' +
          ' are processed'
        '  '
        
          '  if HasError then Exit; //if error then it isn'#39't going to save ' +
          'to DB so there won'#39't be any events to set...'
        '  '
        
          '  if IsRecordChanged then IsChanged := True; //Order Changes use' +
          ' this flag in Order_Hdr.AfterDetailMap'
        '  '
        '  if DATA_OrderLine.Eof then'
        '  begin'
        '    LogTest('#39'Line new'#39');'
        '    D_Order_Line['#39'StatusNum'#39'].Value := Order_Line_New;'
        
          '  end else if D_Order_Line['#39'StatusNum'#39'].Value <> Order_Line_Dele' +
          'ted then //if user hasnt set to deleted'
        '  begin'
        '    if IsRecordChanged then'
        '    begin'
        '      LogTest('#39'Line changed'#39');'
        '      D_Order_Line['#39'StatusNum'#39'].Value := Order_Line_Changed;'
        '    end else'
        '    begin'
        '      LogTest('#39'Line same'#39');'
        '      D_Order_Line['#39'StatusNum'#39'].Value := Order_Line_Same;'
        '    end;'
        '  end else'
        '    LogTest('#39'Line set deleted by user'#39');  '
        
          '  //Order_Line_Deleted - all lines will have been defaulted to t' +
          'his by SQL execution in Order.BeforeMap for reseponses so any mi' +
          'ssing lines will be deleted by default    '
        'end;')
      CompiledStatus = 1
      LastPosition = 12
