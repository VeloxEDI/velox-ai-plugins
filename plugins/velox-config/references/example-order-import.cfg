        'function CheckReassignPartner(aRecord: TdaSQLQueryDataView): boo' +
        'lean;'
      'begin'
      
        '  //change to Partner from original order (eg Mainfright 3PL ASN' +
        ' comes in for Foodstuffs order - need to change ASN to FS partne' +
        'r)'
      
        '  //aRecord is the dataset being mapped that value will be set i' +
        'nto.'
      '  Result := False;'
      '  if (DATA_Partner['#39'AssignPartnerFromOrder'#39'].AsBoolean) then'
      '  begin'
      '    if (Data_Order.Empty) then'
      '    begin'
      
        '      LogInfo('#39'Partner is unable to be reassigned as Order is no' +
        't found'#39'); '
      '    end else if (Data_Order['#39'PartnerNum'#39'].AsInteger0 <> 0) then'
      '    begin'
      
        '      LogInfo(vxFormat('#39'Partner has been reassigned from %s to %' +
        'd'#39', [DATA_Partner['#39'Description'#39'].AsString, Data_Order['#39'PartnerNu' +
        'm'#39'].AsInteger])); '
      
        '      aRecord['#39'PartnerNum'#39'].Value := Data_Order['#39'PartnerNum'#39'].As' +
        'Integer; //dont need to reload partner (leave data_partner as 3P' +
        'L, just update PartnerNum field)'
      '      Result := True;'
      '    end else'
      '    begin'
      
        '      LogInfo(vxFormat('#39'Partner is unable to be reassigned as Or' +
        'der %s foes not have a valid partner'#39', [Data_Order['#39'Code'#39'].AsInt' +
        'eger])); '
      '    end;  '
      '  end;'
      'end;'
