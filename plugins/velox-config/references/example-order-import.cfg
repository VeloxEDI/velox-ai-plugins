        'ssageCode: string): boolean;'
      'begin'
      
        '  //this will throw and error and return false if duplicates mes' +
        'sagecodes are not allowed'
      '  Result := True;'
      '  if (aMessageCode = '#39#39') then Exit;'
      
        '  if Not Settings['#39'ErrorDuplicateShipmentMessage'#39'].AsBoolean the' +
        'n Exit; //dont bother with duplicate check'
      '      '
      
        '  GetData(DATA_Interchange, vxFormat('#39'select * from shipment_eve' +
        'nt where ManifestNum=%d and MessageCode=%s and StatusNum<=2 --Al' +
        'lowDuplicateShipment'#39', [aManifestNum, SafeSQL(aMessageCode)]));'
      '  if Not DATA_Interchange.Eof then'
      '  begin'
      '    Result := False;'
      
        '    CreateIssue(1004, vxFormat('#39'Shipment file with message code ' +
        #39#39'%s'#39#39' (for manifest num %d) has previously been processed.'#39', [a' +
        'MessageCode, aManifestNum]));'
      '  end;'
      'end;'
