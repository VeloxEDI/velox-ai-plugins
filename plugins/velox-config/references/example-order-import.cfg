      '    if Result = 0 then'
      '    begin'
      '      Result := GetProductForPartner(aBuyerCode);'
      '      if Result = 0 then'
      '      begin'
      '        Result := GetProductForPartner(aProductCode);'
      '        if Result = 0 then'
