      '  end;'
      '  '
      '  Result := DATA_Issue['#39'Status'#39'].AsInteger;'
      '  '
      
        '  if (Result = 0) then Exit; //if the issue is not being logged ' +
        'then dont update Notify flags below'
      '  '
      
        '  if (NotifyCompany) and (NotifyPartner) then Exit; //for speed ' +
        'can stop checking as soon as both set'
