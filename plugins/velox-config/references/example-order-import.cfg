        'function GetPartnerFromArray(const aCustomerCodeList, aPartnerCo' +
        'deList, aMatchValue: string): string;'
      'var lCustomerArray, lPartnerArray: TStringArray;'
      '  lIndex: integer;'
      'begin'
      
        '  //Have to determine what partner is involved based on the info' +
        ' at hand'
      
        '  //in this case using the account details and looking up an arr' +
        'ay from Variables'
      ''
      '  Result := '#39#39';'
      '  if aMatchValue = '#39#39' then Exit;'
      '  '
      
        '  SplitString(aCustomerCodeList, '#39';'#39', lCustomerArray); //this li' +
        'st should come from a Variable eg see V_Unleashed['#39'CustomerCodes' +
        #39'].AsString'
      
        '  SplitString(aPartnerCodeList, '#39';'#39', lPartnerArray);  //this lis' +
        't should come from a Variable eg see V_Unleashed['#39'PartnerCodes'#39']' +
        '.AsString'
      '  '
      '  if Length(lCustomerArray) <> Length(lPartnerArray) then'
      '  begin'
      
        '    LogError('#39'Please review the List values from Variables and s' +
        'et CustomCodes and PartnerCodes with same number of values'#39');'
      '    Exit;'
      '  end;'
      '  '
      '  lIndex := StringIndex(aMatchValue, lCustomerArray, False);'
      
        '  //LogInfo(vxFormat('#39'Customer %s is index %d'#39', [aMatchValue, lI' +
        'ndex]));'
      '  '
      '  if lIndex = -1 then'
      '  begin'
      '    //Customer code not in customer list so can be ignored'
      
        '    LogInfo('#39'Customer code '#39'+aMatchValue+'#39' is not in the custome' +
        'r list.'#39');'
      '  end else'
      
        '    //get the index of the customer array matching the customer ' +
        'code, then lookup the partner code of that index'
      '    Result := lPartnerArray[lIndex];'
      'end;'
