        'us_Test,8=Status_Highlight'
      '  Result := Ord(Action.Log.StatusType);'
      ''
      
        '  LogSQLComment('#39'Status: '#39' + IntToStr(Result) + '#39' Issue Count: '#39 +
        ' + IntToStr(DIssue.Recordcount));'
      ''
      
