          '  // Sales Order      - Partner'
          '  // Purchase Order   - Application'
          '  // Customer ASN     - Application'
          '  // Supplier ASN     - Partner'
          '  // Customer Invoice - Application'
          '  // Supplier Invoice - Partner'
          '  '
          '  if Not Data_Order.Eof then'
          '  begin'
          
            '    if ((TypeNum = Type_SalesOrder) and (IsSourcePartner(SourceN' +
            'um))) or  //Sales Order from partner'
          
            '       ((TypeNum = Type_PurchaseOrder) and (IsSourceInternal(Sou' +
            'rceNum))) then //Purchase Order from app'
          '      Value := Data_Order['#39'Revision'#39'].AsInteger + 1;'
          '  end else'
          '    Value := 1;'
          'end;')
        CompiledStatus = 1
        LastPosition = 1
        FieldName = 'Revision'
        VxFieldType = fftUserSet
      end
