      object FloFieldMap95: TvxFieldMap
        Description = 'ProductCode'
        OnMapFormula.Strings = (
          '{$i Velox}'
          'procedure OnMapEvent(var Value:Variant);  //ProductCode'
          'begin'
          '  if DATA_Product.NotEmpty then'
          '  begin'
          
            '    Value := DATA_Product['#39'Code'#39'].Value; //make this the interna' +
            'l product code so it can be used by internal integration'
          '    '
          
            '    //If the incoming product code is different then add to the ' +
            'customers theircode list, unless it is default product'
          
            '    if (OrderLine['#39'ProductCode'#39'].Value <> DATA_Product['#39'Code'#39'].V' +
            'alue) and (DATA_Product['#39'Num'#39'].AsInteger <> DATA_Application['#39'De' +
            'faultProductNum'#39'].AsInteger) then'
          
            '      if (TypeNum = Type_SalesOrder) and (StatusNum in [Order_Or' +
            'dered, Order_Changed]) then '
          
            '        AddProductTheirCode(DATA_BillTo, OrderLine['#39'ProductCode'#39 +
            '].AsString)'
          
            '      else if (TypeNum = Type_PurchaseOrder) and (StatusNum in [' +
            'Order_Responded]) then '
          
            '        AddProductTheirCode(DATA_BillFrom, OrderLine['#39'ProductCod' +
            'e'#39'].AsString);'
          '  end else'
          '    Value := OrderLine['#39'ProductCode'#39'].Value;'
          '    '
          
            '  //Detect changes. Order_Hdr.AfterDetailMap will overwrite stat' +
            'uses based on IsRecordChanged/IsChanged flag'
          
            '  if (StatusNum in [Order_Ordered, Order_Responded, Order_Change' +
            'd]) then'
          '    if (DATA_OrderLine.Empty) then'
          '    begin'
          
            '      if (StatusNum <> Order_Ordered) then //always a change for' +
            ' responded, and change'
          '        IsRecordChanged := True;'
          
            '      if Data_Order.NotEmpty then //only show this if there is a' +
            'n existing order - otherwise its a change imported wihtout origi' +
            'nal order so dont need message'
          '      begin'
          
            '        if (StatusNum = Order_Ordered) then IsRecordChanged := T' +
            'rue; //also change for orders if order already existed;'
          
            '        CreateIssue(1315, vxFormat('#39'New order line for product %' +
            's of quantity %f price %f added.'#39', [VarToStr(Value), OrderLine['#39 +
            'Qty'#39'].AsFloat0, OrderLine['#39'UnitPrice'#39'].AsFloat0]));'
          '      end;'
          
            '    end else if (DATA_OrderLine.NotEmpty) and (Value <> DATA_Ord' +
            'erLine['#39'ProductCode'#39'].Value) then'
          '    begin'
          '      IsRecordChanged := True;'
          '      if StatusNum = Order_Responded then'
          
            '        CreateIssue(1301, vxFormat('#39'Confirmed product %s changed' +
            ' to %s.'#39', [DATA_OrderLine['#39'ProductCode'#39'].AsString, VarToStr(Valu' +
            'e)]))'
          '      else  '
          
            '        CreateIssue(1311, vxFormat('#39'Product %s changed to %s.'#39', ' +
            '[DATA_OrderLine['#39'ProductCode'#39'].AsString, VarToStr(Value)]));'
          '    end;'
          'end;')
        CompiledStatus = 1
        LastPosition = 1
        FieldName = 'ProductCode'
        VxFieldType = fftUserSet
      end
