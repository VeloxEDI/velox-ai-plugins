    object FloViewMap4: TvxViewMap
      Description = 'Order_Hdr'
      BeforeMapFormula.Strings = (
        '{$I Velox}'
        'procedure BeforeMapEvent(var Value:Variant);  //Order_Hdr'
        'begin'
        
          '  SetIssueTable(D_Order_Issue); //set table that will receive an' +
          'y error messages'
        '  LogSQLComment('#39'Order Hdr '#39'+ORDER['#39'Code'#39'].AsSql);'
        '  '
        '  LogInfo('#39'Partner: '#39' + DATA_Partner['#39'Code'#39'].AsString);'
        '  LogInfo(ORDER['#39'Code'#39'].AsInfo);'
        '  LogInfo(ORDER['#39'OrderNo'#39'].AsInfo);'
        '  LogInfo(Order['#39'TheirOrderNo'#39'].AsInfo);'
        '  '
        '  //Validate data'
        '  if IsNullorEmpty(Order['#39'TypeCode'#39'].Value) then'
        '    CreateIssue(1201, '#39'Order.TypeCode value must be provided'#39')'
        
          '  else if GetOrderTypeNum(Order['#39'TypeCode'#39'].AsString) = null the' +
          'n'
        
          '    CreateIssue(1241, vxFormat('#39'Order.TypeCode '#39#39'%s'#39#39' is not val' +
          'id'#39', [Order['#39'TypeCode'#39'].AsString]))'
        '  else'
        '    TypeNum := GetOrderTypeNum(Order['#39'TypeCode'#39'].AsString);'
        '  if IsNullorEmpty(Order['#39'StatusCode'#39'].Value) then'
        '    StatusNum := Order_Ordered'
        
          '  else if GetOrderStatusNum(Order['#39'StatusCode'#39'].AsString) = null' +
          ' then'
        
          '    CreateIssue(1241, vxFormat('#39'Order.StatusCode '#39#39'%s'#39#39' is not v' +
          'alid'#39', [Order['#39'StatusCode'#39'].AsString]))'
        '  else'
        
          '    StatusNum := GetOrderStatusNum(Order['#39'StatusCode'#39'].AsString)' +
          ';'
        '  if IsNullorEmpty(Order['#39'SourceCode'#39'].Value) then'
        '    SourceNum := Source_App'
        '  else if GetSourceNum(Order['#39'SourceCode'#39'].AsString) = null then'
        
          '    CreateIssue(1241, vxFormat('#39'Order.SourceCode '#39#39'%s'#39#39' is not v' +
          'alid'#39', [Order['#39'SourceCode'#39'].AsString]))'
        '  else'
        '    SourceNum := GetSourceNum(Order['#39'SourceCode'#39'].AsString);'
        
          '  if IsNullorEmpty(Order['#39'Code'#39'].Value) and IsNullorEmpty(Order[' +
          #39'Num'#39'].Value) then'
        
          '    CreateIssue(1201, '#39'Order.Code or Order.Num value must be pro' +
          'vided'#39');'
        
          '  if IsNullorEmpty(Order['#39'BillToCode'#39'].Value) and (StatusNum in ' +
          '[Order_Ordered, Order_Changed]) then'
        
          '    CreateIssue(1201, '#39'Order.BillToCode value must be provided'#39')' +
          ';'
        
          '  if IsNullorEmpty(Order['#39'OrderNo'#39'].Value) and (StatusNum = Orde' +
          'r_Responded) then'
        '    CreateIssue(1201, '#39'Order.OrderNo value must be provided'#39');'
        ''
        '  if TypeNum = Type_SalesOrder then //safe case sensitive check'
        '  begin'
        
          '    //order from company to customer (if received from customer ' +
          'will use their codes, or if app it will use our codes)'
        
          '    GetBillFrom(Party_Company, Order['#39'BillFromCode'#39'].AsString, D' +
          'ata_Application['#39'DefaultCompanyNum'#39'].Value);'
        
          '    GetBillTo(Party_Customer, Order['#39'BillToCode'#39'].AsString, null' +
          ');'
        '  end else if TypeNum = Type_SupplierASN then '
        '  begin //PO'
        
          '    //order from supplier to company (if sent from company will ' +
          'use our codes, or if EDI it will use their codes)'
        
          '    GetBillFrom(Party_Supplier, Order['#39'BillFromCode'#39'].AsString, ' +
          'null);'
        
