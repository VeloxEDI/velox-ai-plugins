          '  lMesg: string;'
          '  //lPackDiff: integer; '
          'begin'
          '  //Only need to calc for Ordered, and Changed'
          
            '  if Not (StatusNum in [Order_Ordered, Order_Changed]) then Exit' +
            ';'
          '  '
          '  //Set starting point as Qty value.  QtyCalced is write only'
          
            '  //Qty is in order pack size based on QtyUOM eg if Qty=2 and Qt' +
            'yUom=4 then unit qty is 8'
          
            '  Value := D_Order_Line['#39'Qty'#39'].AsFloat0; //convert any possible ' +
            'null to 0'
          ''
          
            '  if (Data_Product.Empty) and ((Settings['#39'CheckOrderQty'#39'].AsBool' +
            'ean) or (Settings['#39'CheckOrderQtyPackSize'#39'].AsBoolean)) then'
          
            '    Exit;    //dont need to output message as it already done in' +
            ' QtyApp'
          '  '
          
            '  {if (Settings['#39'CheckOrderQtyPackSize'#39'].AsBoolean) and ((DATA_P' +
            'roduct['#39'SellUnits'#39'].AsInteger0 > 1) or (D_Order_Line['#39'UomUnits'#39']' +
            '.AsInteger0 > 1)) then'
          '  begin'
          
            '    lPackDiff := DATA_Product['#39'SellUnits'#39'].AsInteger0 mod D_Orde' +
            'r_Line['#39'UomUnits'#39'].AsInteger0; //difference between order UOMUni' +
            'ts and product UOMUnits'
          '    if lPackDiff > 0 then'
          
            '      CreateIssue(1322, vxFormat('#39'Product %s ordered pack size %' +
            'd not divisible with product pack size %d for line %d.  Please c' +
            'heck your master data is aligned with your trading partner.'#39', [D' +
            'ATA_Product['#39'Code'#39'].AsString, D_Order_Line['#39'UomUnits'#39'].AsInteger' +
            ', DATA_Product['#39'SellUnits'#39'].AsInteger, D_Order_Line['#39'LineNo'#39'].As' +
            'Integer]))'
          '    else if (Trunc(Value) <> Value) then'
          '    begin'
          
            '      lQtyOrdered := Value * D_Order_Line['#39'UomUnits'#39'].AsFloat;//' +
            'to make format work'
          
            '      CreateIssue(1323, vxFormat('#39'Product %s ordered qty %f not ' +
            'denomination of product pack size %d for line %d.  Qty decreased' +
            ' to full packs.'#39', [DATA_Product['#39'Code'#39'].AsString, lQtyOrdered, D' +
            'ATA_Product['#39'SellUnits'#39'].AsInteger, D_Order_Line['#39'LineNo'#39'].AsInt' +
            'eger]))'
          
            '      Value := Trunc(Value); //if SellUnit and UomUnits are alig' +
            'ned simply truncate to a whole pack'
          '    end;'
          '    //Value - (Trunc(Value) mod D_Order_Line['#39'UomUnits'#39'].Value);'
          '  end;}'
          '    '
          '  if Settings['#39'CheckOrderQty'#39'].AsBoolean then'
          '  begin'
          '    if IsZero(D_Order_Line['#39'QtyApp'#39'].Value) then'
          '    begin'
          '      if Not Settings['#39'UseOrderQtyForZeroStock'#39'].AsBoolean then'
          '        lMesg := '#39'  System qty used.'#39
          '      else'
          '        lMesg := '#39'  Order qty used.'#39';'
          
            '      CreateIssue(1329, vxFormat('#39'Product %s ordered qty %f but ' +
            'zero available for line %d.%s'#39', [DATA_Product['#39'Code'#39'].AsString, ' +
            'StrToFloat(Value), D_Order_Line['#39'LineNo'#39'].AsInteger, lMesg]));'
          
            '      if Not Settings['#39'UseOrderQtyForZeroStock'#39'].AsBoolean then ' +
            '//must overwrite qty after above CreateIssue'
          '        Value := D_Order_Line['#39'QtyApp'#39'].Value; '
          
            '    end else if MoreThanValue(Value, D_Order_Line['#39'QtyApp'#39'].Valu' +
            'e) then'
          '    begin'
          '      if Not Settings['#39'UseOrderQtyForLowStock'#39'].AsBoolean then'
          '        lMesg := '#39'  System qty used.'#39
          '      else'
          '        lMesg := '#39'  Order qty used.'#39';'
          
            '      CreateIssue(1320, vxFormat('#39'Product %s ordered qty %f is m' +
            'ore than available quantity %f for line %d.%s'#39', [DATA_Product['#39'C' +
            'ode'#39'].AsString, StrToFloat(Value), D_Order_Line['#39'QtyApp'#39'].AsFloa' +
            't, D_Order_Line['#39'LineNo'#39'].AsInteger, lMesg]));'
          
            '      if Not Settings['#39'UseOrderQtyForLowStock'#39'].AsBoolean then /' +
            '/must overwrite qty after above CreateIssue'
          '        Value := D_Order_Line['#39'QtyApp'#39'].Value; '
          '    end;'
          '  end;'
          ''
          '  '
          ''
          
            '  if (DATA_Product['#39'MoqUnits'#39'].AsInteger0 > 0) and (Value < DATA' +
            '_Product['#39'MoqUnits'#39'].AsInteger0) then'
          '  begin'
          
            '    CreateIssue(1321, vxFormat('#39'Product %s ordered qty %f is les' +
            's than minimum quantity %d for line %d.  Min qty used.'#39', [DATA_P' +
            'roduct['#39'Code'#39'].AsString, StrToFloat(Value), DATA_Product['#39'MoqUni' +
            'ts'#39'].AsInteger, D_Order_Line['#39'LineNo'#39'].AsInteger]))'
          '    Value := DATA_Product['#39'MoqUnits'#39'].Value;'
          '  end;'
          'end;')
        CompiledStatus = 1
        LastPosition = 36
