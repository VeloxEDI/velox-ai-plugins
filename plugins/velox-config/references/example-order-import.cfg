        '  GetData(DATA_Temp, vxFormat('#39'select * from Product_Party PP wh' +
        'ere PP.ProductNum = %d and PP.PartyNum = %d and PP.TheirCode = %' +
        's --AddProductTheirCodeCheck'#39', [DATA_Product['#39'Num'#39'].AsInteger, a' +
        'DATA['#39'Num'#39'].AsInteger, SafeSQL(aCode)]));'
      
        '  if DATA_Temp.Empty then //Create a record then return it in re' +
        'sults...'
      
        '    ExecSQLData(DATA_Temp, vxFormat('#39'  insert into Product_Party' +
        ' (ProductNum, PartyNum, TheirCode) values (%d, %d, %s); SELECT S' +
        'COPE_IDENTITY() as Num --AddProductTheirCode'#39', [DATA_Product['#39'Nu' +
        'm'#39'].AsInteger, aDATA['#39'Num'#39'].AsInteger, SafeSQL(aCode)]));'
      '  '
      '  Result := DATA_Temp['#39'Num'#39'].AsInteger;'
      'end;'
