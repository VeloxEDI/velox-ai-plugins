      'function GetIssueDetails(aIssueNum: integer): integer;'
      'begin'
      
        '  GetData(DATA_Issue, vxFormat('#39'select Status, NotifyCompany, No' +
        'tifyPartner from Issue where Num = %d'#39', [aIssueNum]));'
