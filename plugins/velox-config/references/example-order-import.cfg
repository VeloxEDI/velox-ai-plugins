      AfterDetailMapFormula.Strings = (
        '{$I Velox}'
        'procedure AfterDetailMapEvent(var Value: Variant);  //Order_Hdr'
        'var lRevisionUpdate, lRevisionAppUpdate: string;'
        'begin'
        
          '  if Not Value then Exit;  //only need to do this if the details' +
          ' are processed'
        '  '
        
          '  if HasError then Exit; //if error then it isn'#39't going to save ' +
          'to DB so there won'#39't be any events to set...'
        '  '
        
          '  //Default all existing lines as deleted status (as incoming da' +
          'ta might not have full set of lines) - further processing will s' +
          'et the lines that are needed so orphaned lines left as deleted'
        
          '  //Set revision +1 so that these deleted lines still show up on' +
          ' the next report etc (or revision is inline with updated lines)'
        
          '  //do this on AfterDetailMap so the line processing reads corre' +
          'ct line values ie revision not updated'
        '  if Data_Order.NotEmpty then'
        
          '  begin //this will now update the table prior to the map being ' +
          'saved, but after the original data being read and used in mappin' +
          'g...'
        
          '    //TODO track each ID or NUM as the lines are processed so it' +
          ' only updates the orphaned lines'
        '    lRevisionUpdate := '#39#39'; lRevisionUpdate := '#39#39';'
        
          '    if ((TypeNum = Type_SalesOrder) and (IsSourcePartner(SourceN' +
          'um))) or  //Sales Order from partner'
        
          '      ((TypeNum = Type_PurchaseOrder) and (IsSourceInternal(Sour' +
          'ceNum))) then //Purchase Order from app'
        
          '        lRevisionUpdate := vxFormat('#39', Revision=%d'#39', [DATA_Order' +
          '['#39'Revision'#39'].AsInteger + 1]);'
        '     if IsSourceInternal(SourceNum) then'
        
          '        lRevisionAppUpdate := vxFormat('#39', RevisionApp=%d'#39', [Data' +
          '_Order['#39'RevisionApp'#39'].AsInteger + 1]);'
        
          '     ExecSQLDest(vxFormat('#39'Update Order_Line set StatusNum = 4%s' +
          '%s where OrderHdrNum = %d'#39', [lRevisionUpdate, lRevisionAppUpdate' +
          ', DATA_Order['#39'Num'#39'].AsInteger]));'
        
          '     if (lRevisionUpdate <> '#39#39') or (lRevisionAppUpdate <> '#39#39') th' +
          'en //need to update status to make it easy to add revision field' +
          's'
        
          '      ExecSQLDest(vxFormat('#39'Update Order_Line_Consignee set Stat' +
          'us=Status%s%s where OrderHdrNum = %d'#39', [lRevisionUpdate, lRevisi' +
          'onAppUpdate, DATA_Order['#39'Num'#39'].AsInteger]));'
        '  end;'
        ''
        '  if (StatusNum = Order_Ordered) then'
        '  begin'
        
          '    if (Data_Order.NotEmpty) and (IsChanged) and (Data_Order['#39'St' +
          'atus'#39'].AsInteger <> Status_Issue) then //if existing order found' +
          ' and a change has occurred then treat like change, unless origin' +
          'al order is issue state (then its just a correction)'
        '    begin'
        '      LogTest('#39'Order loaded as change'#39');'
        '      D_Order_Hdr['#39'StatusNum'#39'].Value := Order_Changed; '
        '    end;'
        '  end else if (StatusNum = Order_Changed) then'
        '  begin'
        
          '    if (Data_Order.Empty) then //if original order not present t' +
          'hen treat as a order'
        '    begin'
        '      LogTest('#39'Order Change loaded as order'#39');'
        '      D_Order_Hdr['#39'StatusNum'#39'].Value := Order_Ordered; '
        
          '    end else if (Not IsChanged) then //if this flag is still tru' +
          'e at end of processing then order can be set to confirmed status' +
          ' (instead of it  being changed)'
        '    begin'
        '      LogTest('#39'Order Change Confirmed'#39');'
        '      D_Order_Hdr['#39'StatusNum'#39'].Value := Order_Confirmed;  '
        '    end;'
        '  end;'
        
          '  LogTest('#39'Final Order Status '#39' + GetOrderStatusCode(D_Order_Hdr' +
          '['#39'StatusNum'#39'].Value));'
        '  '
        
          '  if (StatusNum = Order_Responded) and (IsChanged) and (D_Order_' +
          'Hdr['#39'ResponseStatusNum'#39'].Value <> Order_Response_Rejected) then'
        '  begin'
        '    LogTest('#39'Order Response Changed'#39');'
        
          '    D_Order_Hdr['#39'ResponseStatusNum'#39'].Value := Order_Response_Cha' +
          'nged; //Override what user provided if there is a change.'
        '  end;'
        '  if (StatusNum = Order_Responded) then'
        
          '    LogTest('#39'Final Response Status '#39' + GetOrderResponseStatusCod' +
          'e(D_Order_Hdr['#39'ResponseStatusNum'#39'].Value)); '
        ''
        ''
        '  D_Order_Hdr['#39'Status'#39'].Value := GetStatus;'
        '  '
        
          '  //if status=responded and all order_consignee are not responde' +
          'd then skip events'
        
          '  //select count(*) from order_consignee where OrderHdrNum=%d an' +
          'd StatusNum<>Order_Responded and not Code=Order_Consignee.Code /' +
          '/this order_consignee is not committed yet'
        '  //if count>0 then skip'
        '  '
        
          '  //Figure out what event types to register for the transaction ' +
          '- or set the event flags yourself manually (SendEvent,NotifyComp' +
          'anyEvent,NotifyPartnerEvent)'
        
          '  GetEventTypes(Intf_Order, D_Order_Hdr['#39'TypeNum'#39'].AsInteger0, D' +
          '_Order_Hdr['#39'StatusNum'#39'].AsInteger0); //get registered events'
        
          '  CreateEvents(MESSAGE['#39'MessageCode'#39'].AsString, MESSAGE['#39'OrgFile' +
          'Path'#39'].AsString, MESSAGE['#39'OrgFileName'#39'].AsString); //create even' +
          't entries for each registered event'
        '  '
        
          '  if HasError then //Stop processing if error, issues want to ke' +
          'ep processing and save to DB.'
        
          '    SQL.Clear; //something failed so clear this SQL so it doesn'#39 +
          't try deleting any existing data'
        'end;')
      OnStartMapFormula.Strings = (
