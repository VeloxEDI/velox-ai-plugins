        'function CalcDeliveryDateZone(const aPartyNum: integer; const aF' +
        'romZoneNum, aToZoneNum: variant; const aStartDate: TDateTime): T' +
        'DateTime;'
      'var lDayOfWeek: integer;'
      'begin'
      
        '  Result := aStartDate; //aStartDate should be the default deliv' +
        'ery date'
      '  '
      '  GetPartyForNum(aPartyNum);'
      '  '
      '  //Check allow same day delivery'
      
        '  if (Data_Party.NotEmpty) and (Data_Party['#39'AllowSameDayDelivery' +
        #39'].AsBoolean = True) and (aFromZoneNum = aToZoneNum) then Exit; ' +
        '//allow startdate to be used.  '
      '  '
      '  //check holiday at start location'
      '  while IsHoliday(Result, aFromZoneNum) do'
      '    Result := Result + 1;  '
      '  '
      '  //Calc Zone Offset'
      '  if (aFromZoneNum <> null) and (aToZoneNum <> null) then'
      '  begin'
      
        '    GetData(Data_ZoneOffset, vxFormat('#39'select * from Zone_Delive' +
        'ry_Offset where FromZoneNum = %d and ToZoneNum = %d'#39', [StrToInt(' +
        'aFromZoneNum), StrToInt(aToZoneNum)]));'
      '    if Not Data_ZoneOffset.Eof then'
      '      Result := Result + Data_ZoneOffset['#39'Days'#39'].AsInteger0;'
      '  end else'
      
        '    Result := Result + Settings['#39'DefaultDeliveryDayOffset'#39'].AsIn' +
        'teger0;'
      '     '
      '  //Check Weekend Allowed'
      
        '  if (Data_Party.NotEmpty) and (Data_Party['#39'AllowWeekendDelivery' +
        #39'].AsBoolean = False) then'
      '  begin'
      '    lDayOfWeek := DayOfTheWeek(Result); //7=Sunday'
      '    if (lDayOfWeek = 6) then'
      '      Result := Result + 2'
      '    else if (lDayOfWeek = 7) then'
      '      Result := Result + 1;'
      '  end;'
      '  '
      '  //Check holiday at destination'
      '  while IsHoliday(Result, aToZoneNum) do'
      '  begin'
      '    Result := Result + 1;'
      '    '
      '    //Check weekends again...incase public holiday is friday'
      
        '    if (Data_Party.NotEmpty) and (Data_Party['#39'AllowWeekendDelive' +
        'ry'#39'].AsBoolean = False) then'
      '    begin'
      '      lDayOfWeek := DayOfTheWeek(Result); //7=Sunday'
      '      if (lDayOfWeek = 6) then'
      '        Result := Result + 2'
      '      else if (lDayOfWeek = 7) then'
      '        Result := Result + 1;'
      '    end;'
      '  end;'
      '  '
      'end;'
      ''
