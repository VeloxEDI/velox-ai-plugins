          '  lCompare: integer;'
          'begin'
          '  //Only need to calc for Ordered, and Changed'
          
            '  if Not (StatusNum in [Order_Ordered, Order_Changed]) then Exit' +
            ';'
          '  '
          
            '  //Set starting point as UnitPrice value.  UnitPriceCalced is w' +
            'rite only'
          
            '  //UnitPrice is in order pack size based on UomUnits eg if Unit' +
            'Price=100 and QtyUom=4 then per unit price is 25'
          
            '  Value := Round2Up(D_Order_Line['#39'UnitPrice'#39'].AsFloat0, Settings' +
            '['#39'RoundingDPPrice'#39'].AsInteger);'
          '  '
          '  if Settings['#39'CheckOrderPrice'#39'].AsBoolean then'
          '  begin'
          '    if Data_Product.Empty then'
          
            '      Exit; //dont need to output message as it already done in ' +
            'UnitPriceApp   '
          ''
          
            '    //0.0051 is the best 2dp epsilon //todo - make this dynamic ' +
            'by building it with 2dp count'
          
            '    lCompare := CompareValueEpsilon(D_Order_Line['#39'UnitPrice'#39'].As' +
            'Float0, D_Order_Line['#39'UnitPriceApp'#39'].AsFloat0, 0.0051);'
          '    '
          '    if IsZero(D_Order_Line['#39'UnitPriceApp'#39'].AsFloat0) then'
          '    begin'
          
            '      if (Not Settings['#39'UseOrderPriceIfZero'#39'].AsBoolean) or (DAT' +
            'A_Consignee.Active and Data_Consignee['#39'OverrideWithAppPrice'#39'].As' +
            'Boolean) then'
          '        lMesg := '#39'  System price used.'#39
          '      else'
          '        lMesg := '#39'  Order price used.'#39';'
          
            '      CreateIssue(1328, vxFormat('#39'Product %s system price is 0 s' +
            'o order price %f is used for line %d.%s'#39', [DATA_Product['#39'Code'#39'].' +
            'AsString, StrToFloat(Value), D_Order_Line['#39'LineNo'#39'].AsInteger, l' +
            'Mesg]));'
          
            '      if (Not Settings['#39'UseOrderPriceIfZero'#39'].AsBoolean) or (DAT' +
            'A_Consignee.Active and Data_Consignee['#39'OverrideWithAppPrice'#39'].As' +
            'Boolean) then //must overwrite price after above CreateIssue'
          
            '        Value := Round2Up(D_Order_Line['#39'UnitPriceApp'#39'].Value, Se' +
            'ttings['#39'RoundingDPPrice'#39'].AsInteger); '
          '    end else if (lCompare = LessThan) then'
          '    begin'
          
            '      if (Not Settings['#39'UseOrderPriceIfLower'#39'].AsBoolean) or (DA' +
            'TA_Consignee.Active and Data_Consignee['#39'OverrideWithAppPrice'#39'].A' +
            'sBoolean) then'
